<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=/id">
  <link rel="canonical" href="https://amirisback.github.io/id">
  <title>Muhammad Faisal Amir</title>
  <script>
    try {
      var userLang = navigator.language || navigator.userLanguage;
      if (userLang && userLang.toLowerCase().startsWith('en')) {
        window.location.replace('/en');
      } else {
        window.location.replace('/id');
      }
    } catch (e) {
      window.location.replace('/id');
    }
  </script>
</head>
<body>
  <p>Redirecting to <a href="/id">Indonesian version</a> / <a href="/en">English version</a>...</p>
</body>
</html>
